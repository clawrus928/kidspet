# 寵物樂園 nginx 站點設定:把 80 埠的請求轉發到本機 Node 伺服器(3000)。
#
# 目前沒有域名,所以用 default_server 接住「用 IP 直接連」的請求。
# 之後有域名時:把 server_name 改成域名(例如 pet.example.com),
# 並拿掉 default_server,其他專案就能用各自的域名共用 80 埠。
server {
    listen 80 default_server;
    server_name _;

    # 同步資料最大 4MB,與後端 express.json 上限一致
    client_max_body_size 4m;

    # 靜態圖片快取 7 天(圖檔更新時換檔名或等快取過期)
    location /images/ {
        proxy_pass http://127.0.0.1:3000;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
